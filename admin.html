<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iWarehouse | Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}

:root{
  --bg:#04060a;
  --surface:#0a0f16;
  --surface-2:#101722;
  --line:rgba(110,190,255,.14);
  --line-strong:rgba(110,190,255,.32);
  --text:#e8f1fa;
  --muted:#7f93a8;
  --accent:#1de9ff;
  --accent-dim:rgba(29,233,255,.14);
  --warn:#ffb020;
  --bad:#ff4d6a;
  --ok:#35f2a0;
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:'Chakra Petch',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --cut:14px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;color-scheme:dark}
body{
  font-family:var(--font);
  color:var(--text);
  background:var(--bg);
  min-height:100dvh;
  line-height:1.5;
  position:relative;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(48rem 30rem at 82% -8%,rgba(29,233,255,.13),transparent 65%),
    radial-gradient(40rem 28rem at 0% 40%,rgba(61,123,255,.08),transparent 65%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 10%,transparent 75%);
  opacity:.45;
}
img,video{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
.container{width:min(1280px,100% - 2.5rem);margin-inline:auto}
::selection{background:var(--accent);color:#001014}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}

/* header */
.header{
  position:fixed;inset:0 0 auto 0;z-index:100;
  background:rgba(4,6,10,.72);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.header::after{
  content:"";position:absolute;left:0;bottom:-1px;height:1px;width:38%;
  background:linear-gradient(90deg,var(--accent),transparent);
}
.nav{height:4.4rem;display:flex;align-items:center;justify-content:space-between}
.nav__logo{
  font-size:1.45rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);text-shadow:0 0 18px rgba(29,233,255,.45);
}
.nav__list{display:flex;align-items:center;gap:1.6rem}
.nav__link{
  font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);position:relative;transition:color .25s;
}
.nav__link::before{content:"/";color:var(--accent);margin-right:.35rem;opacity:0;transition:opacity .25s}
.nav__link:hover{color:var(--text)}
.nav__link:hover::before{opacity:1}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.78rem 1.35rem;border:1px solid transparent;border-radius:2px;
  font-family:var(--mono);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:transform .2s var(--ease),box-shadow .25s,background .25s,border-color .25s,color .25s;
}
.btn:active{transform:translateY(1px)}
.btn--primary{
  background:var(--accent);color:#001014;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  box-shadow:0 0 0 1px var(--accent);
}
.btn--primary:hover{background:#7ff3ff;filter:drop-shadow(0 0 12px rgba(29,233,255,.6))}
.btn--ghost{background:transparent;border-color:var(--line-strong);color:var(--text)}
.btn--ghost:hover{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 18px var(--accent-dim)}
.btn--danger{background:transparent;border-color:rgba(255,77,106,.4);color:var(--bad)}
.btn--danger:hover{background:rgba(255,77,106,.12);border-color:var(--bad)}
.btn--sm{padding:.55rem .95rem;font-size:.7rem}
.btn[disabled]{opacity:.5;pointer-events:none}

/* hero */
.hero{padding:9.5rem 0 2.5rem;text-align:left;position:relative}
.hero__eyebrow{
  display:inline-flex;align-items:center;gap:.6rem;
  font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);margin-bottom:1.4rem;
}
.hero__eyebrow::before{
  content:"";width:.5rem;height:.5rem;background:var(--ok);border-radius:50%;
  box-shadow:0 0 0 0 rgba(53,242,160,.6);animation:ping 2s infinite;
}
.hero h1{
  font-size:clamp(2.4rem,7vw,5rem);font-weight:700;line-height:1;letter-spacing:-.01em;text-transform:uppercase;
  max-width:14ch;
}
.hero h1 span{color:var(--accent);text-shadow:0 0 28px rgba(29,233,255,.4)}
.hero p{color:var(--muted);max-width:40rem;margin-top:1.3rem;font-size:1.05rem}
.stats{display:flex;flex-wrap:wrap;gap:1rem;margin-top:2.2rem}
.stat{
  min-width:10rem;padding:1rem 1.3rem;background:rgba(10,15,22,.7);
  border:1px solid var(--line);border-left:2px solid var(--accent);
  backdrop-filter:blur(6px);
}
.stat b{display:block;font-family:var(--mono);font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
.stat small{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* panel with rotating edge */
.panel{
  position:relative;padding:clamp(1.1rem,3vw,2rem);
  background:linear-gradient(180deg,rgba(16,23,34,.7),rgba(10,15,22,.85));
  border:1px solid var(--line);border-radius:4px;
  backdrop-filter:blur(10px);
}
.panel::before{
  content:"";position:absolute;inset:-1px;border-radius:4px;padding:1px;pointer-events:none;
  background:conic-gradient(from var(--spin),transparent 0 70%,var(--accent) 88%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 7s linear infinite;
}

/* toolbar */
.toolbar{display:grid;gap:1.1rem;margin-bottom:1.6rem}
.toolbar__row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.field{
  width:100%;background:rgba(4,6,10,.8);border:1px solid var(--line);border-radius:2px;
  padding:.8rem 1rem;outline:none;font-size:.95rem;
  transition:border-color .25s,box-shadow .25s;
}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.field::placeholder{color:#4d6074;font-family:var(--mono);font-size:.82rem}
.toolbar .field--search{flex:1 1 16rem}
.toolbar select.field{width:auto;flex:0 0 auto;cursor:pointer;font-family:var(--mono);font-size:.82rem}
select.field option{background:var(--surface)}

.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{
  padding:.5rem 1rem;border:1px solid var(--line);border-radius:2px;background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  transition:all .25s var(--ease);
}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#001014;font-weight:700;box-shadow:0 0 18px rgba(29,233,255,.35)}
.chip em{font-style:normal;margin-left:.45rem;opacity:.65}

/* grid and cards */
.products{display:grid;gap:1.4rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,17.5rem),1fr))}
.card{
  container-type:inline-size;position:relative;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:2px;
  transition:transform .4s var(--ease),border-color .3s,box-shadow .4s;
  animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms);
}
.card::before,.card::after{
  content:"";position:absolute;z-index:3;width:14px;height:14px;pointer-events:none;
  border:2px solid var(--accent);transition:all .35s var(--ease);opacity:.8;
}
.card::before{top:6px;left:6px;border-right:0;border-bottom:0}
.card::after{bottom:6px;right:6px;border-left:0;border-top:0}
.card:hover{transform:translateY(-6px);border-color:var(--line-strong);box-shadow:0 18px 50px -18px rgba(29,233,255,.35)}
.card:hover::before{top:2px;left:2px;width:22px;height:22px}
.card:hover::after{bottom:2px;right:2px;width:22px;height:22px}
.card__media{position:relative;aspect-ratio:4/3;overflow:hidden;background:#05080c}
.card__media img{width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(1.05);transition:transform .7s var(--ease),filter .4s}
.card:hover .card__media img{transform:scale(1.06);filter:saturate(1.1) contrast(1.08)}
.card__media::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(transparent 55%,rgba(4,6,10,.85)),
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);
}
.card__noimg{
  display:grid;place-items:center;height:100%;color:#2c3c4d;
  font-family:var(--mono);font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;
}
.badge{
  position:absolute;z-index:2;padding:.28rem .65rem;border-radius:1px;
  font-family:var(--mono);font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  backdrop-filter:blur(8px);
}
.badge--stock{top:.9rem;right:.9rem;background:rgba(53,242,160,.12);color:var(--ok);border:1px solid rgba(53,242,160,.45)}
.badge--stock.low{background:rgba(255,176,32,.12);color:var(--warn);border-color:rgba(255,176,32,.5)}
.badge--stock.out{background:rgba(255,77,106,.12);color:var(--bad);border-color:rgba(255,77,106,.5)}
.badge--branch{top:.9rem;left:.9rem;margin:.25rem 0 0 .6rem;background:rgba(4,6,10,.7);border:1px solid var(--line-strong);color:var(--text)}
.badge--video{bottom:.9rem;left:.9rem;background:rgba(4,6,10,.75);border:1px solid var(--line-strong);color:var(--accent)}
.card__body{padding:1.1rem 1.2rem 1.3rem;display:grid;gap:.5rem;flex:1;align-content:start}
.card__cat{font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.card__name{font-size:1.12rem;font-weight:600;line-height:1.3}
.card__price{font-family:var(--mono);font-size:1.35rem;font-weight:700;color:var(--text)}
.card__tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.2rem}
.tag{
  font-family:var(--mono);font-size:.68rem;color:var(--muted);padding:.2rem .55rem;
  border:1px solid var(--line);border-radius:1px;
}
@container (max-width:240px){.card__name{font-size:1rem}.card__price{font-size:1.2rem}}

.empty{grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--muted);font-family:var(--mono);font-size:.85rem}
.empty b{display:block;font-family:var(--font);font-size:1.3rem;color:var(--text);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.06em}

.skeleton{
  height:24rem;border:1px solid var(--line);
  background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);
  background-size:200% 100%;animation:shimmer 1.3s infinite linear;
}

@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes spin{to{--spin:360deg}}
@keyframes ping{70%{box-shadow:0 0 0 .6rem rgba(53,242,160,0)}100%{box-shadow:0 0 0 0 rgba(53,242,160,0)}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* modal */
dialog{
  margin:auto;color:var(--text);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:4px;
  width:min(960px,calc(100% - 1.5rem));max-height:92dvh;overflow:hidden;padding:0;
  box-shadow:0 0 0 1px rgba(29,233,255,.08),0 40px 120px -20px rgba(0,0,0,.95),0 0 80px -30px rgba(29,233,255,.35);
}
dialog[open]{animation:pop .35s var(--ease)}
dialog::backdrop{background:rgba(2,4,7,.78);backdrop-filter:blur(8px)}
.close{
  position:absolute;top:.9rem;right:.9rem;z-index:10;width:2.5rem;height:2.5rem;
  border:1px solid var(--line-strong);border-radius:2px;background:rgba(4,6,10,.8);cursor:pointer;font-size:1.3rem;line-height:1;
  transition:all .25s var(--ease);
}
.close:hover{background:var(--accent);color:#001014;border-color:var(--accent)}

.detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);max-height:92dvh}
.gallery{position:relative;background:#03050a;display:flex;flex-direction:column;min-height:28rem;border-right:1px solid var(--line)}
.gallery__stage{flex:1;display:grid;place-items:center;min-height:18rem}
.gallery__stage img,.gallery__stage video{width:100%;height:100%;object-fit:cover;max-height:70dvh}
.gallery__thumbs{display:flex;gap:.5rem;padding:.75rem;overflow-x:auto;scrollbar-width:thin;border-top:1px solid var(--line)}
.gallery__thumbs button{
  flex:0 0 4.2rem;height:4.2rem;overflow:hidden;border:1px solid var(--line);border-radius:1px;
  cursor:pointer;background:#05080c;opacity:.55;transition:all .25s;
}
.gallery__thumbs button.active{border-color:var(--accent);opacity:1;box-shadow:0 0 14px rgba(29,233,255,.35)}
.gallery__thumbs img,.gallery__thumbs video{width:100%;height:100%;object-fit:cover}
.detail__info{padding:2rem;overflow-y:auto;display:flex;flex-direction:column;gap:1.1rem;scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
.detail__info h2{font-size:1.7rem;line-height:1.2;padding-right:3rem;text-transform:uppercase;letter-spacing:.02em}
.detail__price{font-family:var(--mono);font-size:2rem;font-weight:700;color:var(--accent);text-shadow:0 0 20px rgba(29,233,255,.35)}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.7rem}
.spec{padding:.8rem .95rem;background:rgba(4,6,10,.7);border:1px solid var(--line);border-left:2px solid var(--line-strong);transition:border-color .25s}
.spec:hover{border-left-color:var(--accent)}
.spec small{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.spec span{font-weight:600;word-break:break-word}
.desc{color:var(--muted);font-size:.95rem}

/* footer */
.footer{margin-top:5rem;padding:3rem 1rem;text-align:center;border-top:1px solid var(--line);background:rgba(2,4,7,.6)}
.footer h3{font-size:1.2rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.4rem}
.footer p{color:var(--muted);font-family:var(--mono);font-size:.78rem;letter-spacing:.08em}

/* admin */
.admin{padding:6.5rem 0 3rem}
.admin__head{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.admin__head h1{font-size:clamp(1.7rem,4vw,2.5rem);text-transform:uppercase;letter-spacing:.04em}
.admin .stats{margin:0 0 1.5rem}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:2px}
table{width:100%;border-collapse:collapse;min-width:44rem}
th{
  text-align:left;font-family:var(--mono);font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  padding:.9rem 1rem;background:var(--surface);position:sticky;top:0;
}
td{padding:.75rem 1rem;border-top:1px solid var(--line);vertical-align:middle;font-size:.92rem}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--accent-dim)}
.cell-prod{display:flex;align-items:center;gap:.8rem;font-weight:600}
.cell-prod img{width:3.1rem;height:3.1rem;border:1px solid var(--line);border-radius:1px;object-fit:cover;background:#05080c}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:1px}
.qty button{width:2rem;height:2rem;border:0;background:var(--surface-2);cursor:pointer;transition:.2s;font-family:var(--mono)}
.qty button:hover{background:var(--accent);color:#001014}
.qty span{min-width:2.5rem;text-align:center;font-family:var(--mono);font-weight:700}
.actions{display:flex;gap:.5rem}

/* form */
.form{display:flex;flex-direction:column;max-height:92dvh}
.form__head{padding:1.3rem 1.75rem;border-bottom:1px solid var(--line)}
.form__head h2{font-size:1.3rem;text-transform:uppercase;letter-spacing:.08em}
.form__body{padding:1.5rem 1.75rem;overflow-y:auto;display:grid;gap:1rem;grid-template-columns:repeat(2,minmax(0,1fr))}
.form__body .full{grid-column:1/-1}
.form label{display:grid;gap:.4rem;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.form textarea.field{min-height:5.5rem;resize:vertical}
.form__foot{padding:1.1rem 1.75rem;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:.75rem;align-items:center}
.progress{flex:1;height:4px;background:var(--bg);overflow:hidden;display:none;border:1px solid var(--line)}
.progress.on{display:block}
.progress i{display:block;height:100%;width:0;background:var(--accent);box-shadow:0 0 10px var(--accent);transition:width .2s}

.drop{
  border:1px dashed var(--line-strong);padding:1.6rem;text-align:center;color:var(--muted);cursor:pointer;
  font-size:.9rem;letter-spacing:0;text-transform:none;transition:.25s;
}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-dim);color:var(--text)}
.drop input{display:none}
.previews{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.5rem,1fr));gap:.7rem;margin-top:.8rem}
.preview{position:relative;aspect-ratio:1;overflow:hidden;border:1px solid var(--line);background:#05080c}
.preview img,.preview video{width:100%;height:100%;object-fit:cover}
.preview button{
  position:absolute;top:.3rem;right:.3rem;width:1.5rem;height:1.5rem;border:0;border-radius:1px;
  background:rgba(4,6,10,.85);color:var(--text);cursor:pointer;line-height:1;
}
.preview button:hover{background:var(--bad)}
.preview .tagv{
  position:absolute;left:.3rem;bottom:.3rem;font-family:var(--mono);font-size:.55rem;letter-spacing:.1em;
  padding:.1rem .4rem;background:rgba(4,6,10,.85);color:var(--accent);
}

.toast{
  position:fixed;left:50%;bottom:1.5rem;translate:-50% 150%;z-index:2000;
  padding:.8rem 1.3rem;background:var(--surface-2);border:1px solid var(--accent);border-radius:2px;
  font-family:var(--mono);font-size:.8rem;letter-spacing:.05em;
  box-shadow:0 0 30px -8px rgba(29,233,255,.5);transition:translate .4s var(--ease);
}
.toast.show{translate:-50% 0}
.toast.bad{border-color:var(--bad);box-shadow:0 0 30px -8px rgba(255,77,106,.5)}

@media (max-width:820px){
  .nav__list{gap:.7rem}
  .nav__link{display:none}
  .detail{grid-template-columns:1fr;overflow-y:auto}
  .gallery{min-height:0;border-right:0}
  .gallery__stage{aspect-ratio:4/3;min-height:0}
  .detail__info{overflow:visible}
  .form__body{grid-template-columns:1fr}
  .hero{padding-top:7.5rem}
}
</style>
</head>
<body>

  <!-- DASHBOARD -->
  <div id="appView">
    <header class="header">
      <nav class="nav container">
        <a href="#" class="nav__logo">iWarehouse <small style="font-size:.7rem;color:var(--muted);-webkit-text-fill-color:var(--muted)">Admin</small></a>
        <ul class="nav__list">
          <li><a href="index2.html" class="btn btn--primary btn--sm">Customer Page</a></li>
        </ul>
      </nav>
    </header>

    <main class="admin container">
      <div class="admin__head">
        <h1>Inventory</h1>
        <button class="btn btn--primary" id="addBtn">+ Add product</button>
      </div>

      <div class="stats">
        <div class="stat"><b id="aProducts">0</b><small>Products</small></div>
        <div class="stat"><b id="aUnits">0</b><small>Total units</small></div>
        <div class="stat"><b id="aLow">0</b><small>Low / out of stock</small></div>
        <div class="stat"><b id="aValue">₱0</b><small>Inventory value</small></div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <div class="toolbar__row">
            <input id="aSearch" class="field field--search" type="search" placeholder="Search products…">
            <select id="aBranch" class="field"><option value="all">All Branches</option></select>
            <select id="aCategory" class="field"><option value="all">All Categories</option></select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Product</th><th>Branch</th><th>Category</th><th>Price</th><th>Stock</th><th>Media</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ADD / EDIT -->
  <dialog id="formModal">
    <form class="form" id="productForm">
      <div class="form__head"><h2 id="formTitle">Add product</h2></div>
      <div class="form__body">
        <label class="full">Product name
          <input class="field" name="name" required placeholder="e.g. iPhone 15 Pro">
        </label>
        <label>Branch
          <select class="field" name="branch" id="fBranch" required></select>
        </label>
        <label>Category
          <select class="field" name="category" id="fCategory" required></select>
        </label>
        <label>Price (₱)
          <input class="field" name="price" type="number" min="0" step="1" required>
        </label>
        <label>Quantity
          <input class="field" name="quantity" type="number" min="0" step="1" required>
        </label>
        <label>Color <input class="field" name="color"></label>
        <label>Storage <input class="field" name="storage" placeholder="256GB / N/A"></label>
        <label>Processor <input class="field" name="processor"></label>
        <label>Display <input class="field" name="display"></label>
        <label>Battery <input class="field" name="battery"></label>
        <label>Camera <input class="field" name="camera"></label>
        <label class="full">Description
          <textarea class="field" name="description" placeholder="Optional details shown to customers"></textarea>
        </label>

        <div class="full">
          <label class="drop" id="drop">
            <input type="file" id="files" accept="image/*,video/*" multiple>
            <b style="color:#fff">Drop photos &amp; videos here</b><br>or click to browse
          </label>
          <div class="previews" id="previews"></div>
        </div>
      </div>
      <div class="form__foot">
        <div class="progress" id="progress"><i></i></div>
        <button type="button" class="btn btn--ghost" id="cancelForm">Cancel</button>
        <button type="submit" class="btn btn--primary" id="saveBtn">Save product</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <script type="module">
/* =====================================================
   iWarehouse shared config (index2.html + admin.html)
   Data fields  -> Firebase Firestore
   Images/Video -> Cloudinary
   ===================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1G-ia-NZ2SssegocFJRX1CrkhXH3xrHk",
  authDomain: "miss-lau-app.firebaseapp.com",
  projectId: "miss-lau-app",
  storageBucket: "miss-lau-app.appspot.com",
  messagingSenderId: "1035558029907",
  appId: "1:1035558029907:web:8f1af22b3f32121e8d14a6",
  measurementId: "G-7DCEVP3D1T"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);

/* ---------- CLOUDINARY (browser-safe: NO api secret here) ----------
   1. Cloudinary dashboard -> copy your "Cloud name"
   2. Settings -> Upload -> Add upload preset -> Signing mode: UNSIGNED
      name it:  iwarehouse_unsigned                                   */
const CLOUDINARY = {
  cloudName: "ajtiipby",
  uploadPreset: "iwarehouse_unsigned",
  rootFolder: "iwarehouse/products"
};

/* ---------- UNIFORM NAMING ---------- */
const COLLECTION = "iwarehouse_products";

const BRANCHES = {
  cebu:   "Cebu Branch",
  manila: "Manila Branch",
  davao:  "Davao Branch"
};

const CATEGORIES = {
  laptop:   "Laptops",
  phone:    "Phones",
  mouse:    "Mouse",
  keyboard: "Keyboards"
};

const slugify = (s = "") =>
  s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

/* Firestore doc id:   {branch}_{category}_{product-slug}_{base36time}
   e.g.  cebu_phone_iphone-15-pro_lq3x9a                              */
const buildDocId = ({ branch, category, name }) =>
  `${branch}_${category}_${slugify(name)}_${Date.now().toString(36)}`;

/* Cloudinary public_id:  iwarehouse/products/{branch}/{category}/{slug}_{img|vid}-{n}_{time}
   e.g.  iwarehouse/products/cebu/phone/iphone-15-pro_img-1_lq3x9a    */
const buildPublicId = ({ branch, category, name, kind, index }) =>
  `${CLOUDINARY.rootFolder}/${branch}/${category}/` +
  `${slugify(name)}_${kind === "video" ? "vid" : "img"}-${index}_${Date.now().toString(36)}`;

const formatPrice = (n) =>
  "₱" + Number(n || 0).toLocaleString("en-PH");

const esc = (s = "") =>
  String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* Cloudinary delivery transforms (auto format/quality + resize) */
const optimize = (url, w = 600) =>
  url && url.includes("/upload/")
    ? url.replace("/upload/", `/upload/f_auto,q_auto,w_${w},c_limit/`)
    : url;

/* ---------- UPLOAD (with progress) ---------- */
function uploadToCloudinary(file, publicId, onProgress = () => {}) {
  return new Promise((resolve, reject) => {
    const kind = file.type.startsWith("video") ? "video" : "image";
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", CLOUDINARY.uploadPreset);
    fd.append("public_id", publicId);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/${kind}/upload`);
    xhr.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    xhr.onload = () => {
      const res = JSON.parse(xhr.responseText || "{}");
      xhr.status >= 200 && xhr.status < 300
        ? resolve({ type: kind, url: res.secure_url, publicId: res.public_id })
        : reject(new Error(res.error?.message || "Upload failed"));
    };
    xhr.onerror = () => reject(new Error("Network error"));
    xhr.send(fd);
  });
}

/* ===== PAGE LOGIC ===== */
import {
  collection, onSnapshot, query, orderBy, doc, setDoc, updateDoc, deleteDoc, serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
let products = [];

/* ---------- toast ---------- */
let tt;
function toast(msg, bad = false) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(tt);
  tt = setTimeout(() => (t.className = "toast"), 3000);
}

/* ---------- realtime data (no login: portfolio demo) ---------- */
onSnapshot(query(collection(db, COLLECTION), orderBy("createdAt", "desc")), snap => {
  products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
}, err => toast("Load failed: " + err.message, true));

/* ---------- filters ---------- */
const fill = (el, obj) => Object.entries(obj).forEach(([k, v]) => el.insertAdjacentHTML("beforeend", `<option value="${k}">${v}</option>`));
fill($("aBranch"), BRANCHES);
fill($("aCategory"), CATEGORIES);
fill($("fBranch"), BRANCHES);
fill($("fCategory"), CATEGORIES);
["aSearch", "aBranch", "aCategory"].forEach(id => $(id).addEventListener("input", render));

/* ---------- table ---------- */
function render() {
  const s = $("aSearch").value.toLowerCase(), b = $("aBranch").value, c = $("aCategory").value;
  const list = products.filter(p =>
    (b === "all" || p.branch === b) && (c === "all" || p.category === c) &&
    (p.name || "").toLowerCase().includes(s));

  $("aProducts").textContent = products.length;
  $("aUnits").textContent = products.reduce((n, p) => n + (+p.quantity || 0), 0);
  $("aLow").textContent = products.filter(p => p.quantity <= 5).length;
  $("aValue").textContent = formatPrice(products.reduce((n, p) => n + p.price * p.quantity, 0));

  $("rows").innerHTML = list.length ? list.map(p => {
    const img = (p.media || []).find(m => m.type === "image");
    const vids = (p.media || []).filter(m => m.type === "video").length;
    return `<tr>
      <td><div class="cell-prod">${img ? `<img src="${optimize(img.url, 120)}" alt="">` : `<img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">`}${esc(p.name)}</div></td>
      <td>${esc(BRANCHES[p.branch] || p.branch)}</td>
      <td>${esc(CATEGORIES[p.category] || p.category)}</td>
      <td>${formatPrice(p.price)}</td>
      <td><div class="qty"><button data-q="-1" data-id="${p.id}">−</button><span>${p.quantity}</span><button data-q="1" data-id="${p.id}">+</button></div></td>
      <td>${(p.media || []).length - vids} IMG / ${vids} VID</td>
      <td><div class="actions">
        <button class="btn btn--ghost btn--sm" data-edit="${p.id}">Edit</button>
        <button class="btn btn--danger btn--sm" data-del="${p.id}">Delete</button>
      </div></td></tr>`;
  }).join("") : `<tr><td colspan="7" style="text-align:center;padding:2.5rem;color:var(--muted)">No products yet. Click “Add product”.</td></tr>`;
}

$("rows").addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.q) {
    const p = products.find(x => x.id === t.dataset.id);
    if (p.quantity + +t.dataset.q < 0) return;
    await updateDoc(doc(db, COLLECTION, p.id), { quantity: increment(+t.dataset.q), updatedAt: serverTimestamp() });
  }
  if (t.dataset.edit) openForm(products.find(x => x.id === t.dataset.edit));
  if (t.dataset.del) {
    const p = products.find(x => x.id === t.dataset.del);
    if (confirm(`Delete "${p.name}"? This cannot be undone.`)) {
      await deleteDoc(doc(db, COLLECTION, p.id));
      toast("Product deleted");
    }
  }
});

/* ---------- form ---------- */
const form = $("productForm"), dlg = $("formModal");
let editing = null;      // product being edited
let existing = [];       // media already saved
let pending = [];        // new File objects

$("addBtn").onclick = () => openForm(null);
$("cancelForm").onclick = () => dlg.close();

function openForm(p) {
  editing = p;
  form.reset();
  pending = [];
  existing = p ? [...(p.media || [])] : [];
  $("formTitle").textContent = p ? "Edit product" : "Add product";
  if (p) Object.keys(form.elements).forEach(k => {
    if (isNaN(k) && form.elements[k] && p[form.elements[k].name] !== undefined) form.elements[k].value = p[form.elements[k].name];
  });
  drawPreviews();
  dlg.showModal();
}

function drawPreviews() {
  const el = $("previews");
  el.innerHTML = "";
  existing.forEach((m, i) => el.insertAdjacentHTML("beforeend", `
    <div class="preview">${m.type === "video" ? `<video src="${m.url}" muted></video><span class="tagv">VIDEO</span>` : `<img src="${optimize(m.url, 200)}" alt="">`}
    <button type="button" data-ex="${i}" aria-label="Remove">×</button></div>`));
  pending.forEach((f, i) => {
    const u = URL.createObjectURL(f);
    el.insertAdjacentHTML("beforeend", `
      <div class="preview">${f.type.startsWith("video") ? `<video src="${u}" muted></video><span class="tagv">NEW VIDEO</span>` : `<img src="${u}" alt="">`}
      <button type="button" data-new="${i}" aria-label="Remove">×</button></div>`);
  });
}
$("previews").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.ex) existing.splice(+b.dataset.ex, 1);
  if (b.dataset.new) pending.splice(+b.dataset.new, 1);
  drawPreviews();
});

const addFiles = list => {
  pending.push(...[...list].filter(f => /^(image|video)\//.test(f.type)));
  drawPreviews();
};
$("files").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));

form.onsubmit = async e => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(form));
  const data = {
    name: fd.name.trim(), branch: fd.branch, category: fd.category,
    price: +fd.price, quantity: +fd.quantity,
    color: fd.color.trim(), storage: fd.storage.trim() || "N/A", processor: fd.processor.trim() || "N/A",
    display: fd.display.trim() || "N/A", battery: fd.battery.trim() || "N/A", camera: fd.camera.trim() || "N/A",
    description: fd.description.trim()
  };
  data.nameLower = data.name.toLowerCase();

  $("saveBtn").disabled = true;
  const bar = $("progress"); bar.classList.add("on");
  const fill = bar.firstElementChild;

  try {
    const uploaded = [];
    let imgN = existing.filter(m => m.type === "image").length;
    let vidN = existing.filter(m => m.type === "video").length;

    for (let i = 0; i < pending.length; i++) {
      const f = pending[i];
      const kind = f.type.startsWith("video") ? "video" : "image";
      const index = kind === "video" ? ++vidN : ++imgN;
      const pid = buildPublicId({ ...data, kind, index });
      const m = await uploadToCloudinary(f, pid, r => (fill.style.width = ((i + r) / pending.length * 100) + "%"));
      uploaded.push(m);
    }
    fill.style.width = "100%";
    data.media = [...existing, ...uploaded];

    if (editing) {
      await updateDoc(doc(db, COLLECTION, editing.id), { ...data, updatedAt: serverTimestamp() });
    } else {
      await setDoc(doc(db, COLLECTION, buildDocId(data)), { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    }
    toast("Product saved");
    dlg.close();
  } catch (err) {
    console.error(err);
    toast(err.message || "Save failed", true);
  } finally {
    $("saveBtn").disabled = false;
    bar.classList.remove("on");
    fill.style.width = "0";
  }
};

</script>
</body>
</html>
